<!doctype html>
<!-- This file gets deployed as `branded-checkout.html` on staging branch for testing of branded-checkout -->
<html lang="en" data-framework="angularjs">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta
      name="viewport"
      content="width = device-width, minimal-ui, initial-scale = 1, user-scalable = no"
    />
    <title>Cru | Branded Checkout</title>
  </head>
  <body>
    <branded-checkout
      designation-number="2294554"
      show-cover-fees="true"
      premium-code="215662"
      premium-name="Upon Waking by Jackie Hill Perry"
      premium-image-url="https://donate.familylife.com/wp-content/uploads/sites/32/2025/05/uponwaking3.png"
      premium-minimum-amount="5"
      ng-cloak
      hide-spouse-details="true"
      hide-annual="true"
      hide-quarterly="true"
      use-v3="true"
    >
    </branded-checkout>
    <script src="branded-checkout.v2.js"></script>
  </body>
</html>
