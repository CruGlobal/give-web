<!doctype html>
<html lang="en" data-framework="angularjs">

      <ul>
        <li>
          <a href="/assets/img/check-sample.png" download>Sample guide (PDF)</a>

        <li>

            target="_blank"
            rel="noopener noreferrer"

    <branded-checkout
      designation-number="2294554"
      show-cover-fees="true"
